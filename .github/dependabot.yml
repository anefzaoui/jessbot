# Weekly update pull requests for npm packages and the GitHub Actions the workflows use. Each one runs CI (unit tests
# on three systems and the audit gate) before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # playwright-core and patchright-core move together (decision #254): Patchright is the Playwright API with its
    # automation traces removed, released after each Playwright minor, and Jessbot's browser code is written once for
    # both. A new playwright-core minor waits until patchright-core has the same one; patches still come.
    ignore:
      - dependency-name: playwright-core
        update-types: [version-update:semver-minor, version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
