# A version tag (v*): check that it matches package.json and CHANGELOG.md, then publish the GitHub release with that
# version's notes. The Docker image for the same tag is docker.yml's job. Tags are made by the maintainer
# (npm run release -- <version> --tag, docs/RELEASING.md); nothing here makes one.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Release notes from CHANGELOG.md (fails on a tag that doesn't match package.json)
        run: node scripts/release-notes.js "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Jessbot $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
